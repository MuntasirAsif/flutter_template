name: flutter_template
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.12.2

#package dependencies
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  flutter_riverpod: ^3.3.1
  flutter_localizations:
    sdk: flutter
  go_router: ^17.2.2
  dio: ^5.9.2
  retrofit: ^4.9.2
  form_builder_validators: ^11.3.0
  pinput: ^6.0.2
  dropdown_button2: ^3.0.0
  toastification: ^3.2.0
  flutter_spinkit: ^5.2.2
  percent_indicator: ^4.2.5
  cached_network_image: ^3.4.1
  custom_refresh_indicator: ^4.0.1
  json_annotation: ^4.11.0
  google_fonts: ^8.0.2
  image_picker: ^1.2.1
  flutter_svg: ^2.2.4
  flutter_animate: ^4.5.2
  font_awesome_flutter: ^11.0.0
  pretty_dio_logger: ^1.4.0

#dev dependencies
dev_dependencies:
  build_runner: ^2.4.13
  flutter_gen_runner: ^5.5.0
  flutter_launcher_icons: ^0.14.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.13.0
  retrofit_generator: ^10.2.1



#asset generator
flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_gen:
  output: lib/core/gen/
  line_length: 80
#app icon generator
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  remove_alpha_ios: true
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false

